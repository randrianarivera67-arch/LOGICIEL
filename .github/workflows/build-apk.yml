name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'supa.js'
      - 'pay.js'
      - 'app1.js'
      - 'app2.js'
      - 'version.json'
      - 'capacitor.config.json'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses || true

    - name: Clean and install
      run: |
        rm -rf node_modules package-lock.json android
        npm install

    - name: Add Android platform
      run: npx cap add android

    - name: Create assets directory
      run: |
        mkdir -p android/app/src/main/assets/public
        mkdir -p www
        echo "<html><body></body></html>" > www/index.html

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Generate Logiplus launcher icons
      run: |
        if [ ! -f assets/icon.png ]; then echo "⚠️ Tsy misy assets/icon.png"; exit 0; fi
        RES=android/app/src/main/res
        rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
        for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
          set -- $pair
          mkdir -p $RES/mipmap-$1
          convert assets/icon.png -gravity center -crop 1:1 +repage -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
          cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
        done
        echo "✅ Icon Logiplus voaforona"

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK
      run: cp android/app/build/outputs/apk/debug/app-debug.apk admin.apk

    - name: Create Release + upload
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Admin APK v${{ github.run_number }}
        files: admin.apk

    - name: Bump version
      run: |
        V="1.0.${{ github.run_number }}"
        echo "{\"version\":\"$V\",\"download_url\":\"https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/admin.apk\"}" > version.json
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add version.json
        git commit -m "chore: version $V [skip ci]" || exit 0
        git push || exit 0
