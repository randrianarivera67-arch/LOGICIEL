name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'supa.js'
      - 'pay.js'
      - 'app1.js'
      - 'app2.js'
      - 'version.json'
      - 'capacitor.config.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare web dir
      run: |
        mkdir -p www
        echo "<html><body></body></html>" > www/index.html

    - name: Clean install
      run: |
        rm -rf node_modules package-lock.json android
        npm install
        npx cap add android
        npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK
      run: cp android/app/build/outputs/apk/debug/app-debug.apk admin.apk

    - name: Create Release + upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Admin APK v${{ github.run_number }}
        files: admin.apk

    - name: Bump version
      run: |
        V="1.0.${{ github.run_number }}"
        echo "{\"version\":\"$V\",\"download_url\":\"https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/admin.apk\"}" > version.json
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add version.json
        git commit -m "chore: version $V [skip ci]" || exit 0
        git push || exit 0
